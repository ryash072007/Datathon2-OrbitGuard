[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitguard"
version = "0.1.0"
description = "Evidence-driven satellite encounter forecasting and manoeuvre decision support"
requires-python = ">=3.11,<3.15"
dependencies = [
  "Flask>=3.0,<4",
  "gunicorn>=20,<24",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "threadpoolctl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]

[project.scripts]
orbitguard = "orbitguard.__main__:main"

[tool.setuptools.packages.find]
include = ["orbitguard*"]

[tool.setuptools.package-data]
"orbitguard.physics" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
