[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitguard"
version = "0.2.0"
description = "Cascade-aware satellite collision-avoidance decision support on IBM LinuxONE: ML triage, validated Pc screening on the real catalogue, consequence modelling and a grounded Granite brief"
requires-python = ">=3.11,<3.15"
dependencies = [
  "Flask>=3.0,<4",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<4",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "threadpoolctl>=3.1,<4",
  "sgp4>=2.22",
]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]
serve = ["gunicorn>=20,<24"]
# Present in the LinuxONE Jupyter ML image; only needed for the Granite brief and the NNPA benchmark.
llm = ["llama-cpp-python"]
nnpa = ["tensorflow"]

[project.scripts]
orbitguard = "orbitguard.__main__:main"

[tool.setuptools.packages.find]
include = ["orbitguard*"]

[tool.setuptools.package-data]
"orbitguard.physics" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
