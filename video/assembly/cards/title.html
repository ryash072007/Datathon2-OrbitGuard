<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.k{font:500 26px var(--mono);letter-spacing:.32em;color:var(--cyan);text-transform:uppercase;margin-bottom:34px}
h1{margin:0;font-weight:600;font-size:104px;letter-spacing:-.03em;line-height:1.05;text-shadow:0 0 60px rgba(56,214,245,.25)}
h1 b{color:var(--cyan);font-weight:600;margin:0 .22em}
h2{margin:36px 0 0;font-weight:500;font-size:56px;color:#d3def2;letter-spacing:-.01em}
.rule{width:0;height:3px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);margin-top:44px}
</style>
<canvas id="bg"></canvas><div class="vig"></div>
<div class="wrap"><div class="k" id="k">Real-time AI for critical decisions</div>
<h1 id="l1">Datathon2<b>·</b>IBM Z Datathon 2026</h1>
<div class="rule" id="rule"></div>
<h2 id="l2">Cascade-aware satellite collision avoidance</h2></div>
<script src="common.js"></script>
<script>
const bg=makeBg(document.getElementById('bg'),{seed:11});
const $=id=>document.getElementById(id);
function put(el,p,dy=26,blur=10){el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`;el.style.filter=`blur(${(1-p)*blur}px)`}
window.render=function(t){
  bg(t);
  put($('k'),easeOut(seg(t,.3,.9)));
  put($('l1'),easeOut(seg(t,.6,1.1)),34,14);
  $('rule').style.width=(easeOut(seg(t,1.3,1.0))*760)+'px';
  put($('l2'),easeOut(seg(t,1.7,1.0)));
};
window.__ready=true;
</script>
